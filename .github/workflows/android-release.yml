name: Build and Release SISINDEN Android Native APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Verify Gradle Environment
        run: gradle --version

      - name: Run Unit Tests
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee test_log.txt || {
            ERR_MSG=$(tail -n 25 test_log.txt | tr '\n' ' ' | sed 's/"//g')
            echo "::error title=UnitTestFailure::$ERR_MSG"
            exit 1
          }

      - name: Build Application APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build_log.txt || {
            ERR_MSG=$(tail -n 25 build_log.txt | tr '\n' ' ' | sed 's/"//g')
            echo "::error title=BuildFailure::$ERR_MSG"
            exit 1
          }

      - name: Save Error Log to Git Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          echo "# CI FAILURE LOG" > CI_LOG.md
          if [ -f "android/test_log.txt" ]; then
            echo "## test_log.txt" >> CI_LOG.md
            echo '```' >> CI_LOG.md
            cat android/test_log.txt >> CI_LOG.md
            echo '```' >> CI_LOG.md
          fi
          if [ -f "android/build_log.txt" ]; then
            echo "## build_log.txt" >> CI_LOG.md
            echo '```' >> CI_LOG.md
            cat android/build_log.txt >> CI_LOG.md
            echo '```' >> CI_LOG.md
          fi
          git add CI_LOG.md
          git commit -m "ci: capture failure logs"
          git push -f origin ci-debug-log

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          shopt -s globstar nullglob
          for apk in android/app/build/**/*.apk; do
            if [ -f "$apk" ]; then
              echo "Found APK: $apk"
              base=$(basename "$apk")
              cp "$apk" "release-output/$base"
              cp "$apk" release-output/SISINDEN-v1.0.2.apk
              cp "$apk" release-output/SISINDEN-v1.0.1.apk
              cp "$apk" release-output/SISINDEN-v1.0.0.apk
            fi
          done
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SISINDEN-Android-APKs
          path: release-output/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('SISINDEN Android Native {0}', github.ref_name) || format('SISINDEN Android Native v1.0.{0}', github.run_number) }}
          body: |
            ## Rilis Aplikasi SISINDEN Android Native v1.0.2

            Aplikasi resmi kedinasan SISINDEN (Sistem Informasi dan Surat Intelijen Denintel Kodaeral V).
            
            ### Pembaruan Utama v1.0.2:
            - Pemulihan Fitur Absensi & Presensi Kehadiran: Status kehadiran dinas hari ini, pelaporan status (Hadir, Dinas Luar, Piket, Izin), deteksi lokasi GPS, catatan penugasan dinas, dan riwayat presensi 30 hari terakhir.
            - UI/UX Livin'-Inspired Elder-Friendly: Hirarki tipografi kontras tinggi, tombol aksi taktil 52-56dp, kartu status bergradien Navy-Royal Blue, dan navigasi ramah pengguna.
            - Manajemen Kas Presisi Tinggi: Pembenahan kalkulasi dan tampilan nominal Rp1 serta sinkronisasi kas Denintel dan Kas Taktis.
            - Integrasi Penuh Backend: Endpoint REST API mobile attendance terintegrasi dengan database kedinasan.
            - Notifikasi Cerdas: Pengelolaan deduplikasi notifikasi kedinasan.
            
            ### Fitur Utama:
            - Presensi Kehadiran Kedinasan (Absensi Dinas)
            - Otentikasi dan Keamanan: Penyimpanan token terenkripsi DataStore Preferences.
            - Agenda dan Log Surat Dinas: Surat masuk, keluar, dan disposisi.
            - Pengajuan SKHPP: Layanan Surat Keterangan Hasil Penelitian Personel.
            - Manajemen Kas dan Logistik: Monitoring Kas Denintel dan Kas Taktis Satuan.
            - Mitra Intelijen: Monitoring dan matriks iuran jaringan kerja intelijen.
            - Tanda Tangan Elektronik Komandan: Persetujuan dokumen resmi kedinasan.
            - Pelanggaran Personel & Direktori Personel Satuan.
            
            ### Detail Teknis:
            - Versi: 1.0.2 (versionCode 3)
            - Kerangka Kerja: Kotlin Jetpack Compose (Material 3)
            - Min SDK: Android 8.0 (API 26)
            - Target SDK: Android 14 (API 34)
            - Berkas APK: SISINDEN-v1.0.2.apk, app-release.apk
          files: release-output/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
