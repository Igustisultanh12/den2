name: Build and Release SISINDEN Android Native APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Jar Exists
        run: |
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o "android/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Verify Gradle Environment
        working-directory: android
        run: ./gradlew --version

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew :app:test --stacktrace

      - name: Build Application APK
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          shopt -s globstar nullglob
          for apk in android/app/build/**/*.apk; do
            if [ -f "$apk" ]; then
              echo "Found APK: $apk"
              base=$(basename "$apk")
              cp "$apk" "release-output/$base"
              cp "$apk" release-output/SISINDEN-v1.0.0.apk
            fi
          done
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SISINDEN-Android-APKs
          path: release-output/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('SISINDEN Android Native {0}', github.ref_name) || format('SISINDEN Android Native v1.0.{0}', github.run_number) }}
          body: |
            ## Rilis Aplikasi SISINDEN Android Native
            
            Aplikasi resmi kedinasan SISINDEN (Sistem Informasi dan Surat Intelijen Denintel Kodaeral V).
            
            ### Fitur Utama:
            - Otentikasi dan Keamanan: Integrasi login resmi, penyimpanan token terenkripsi DataStore Preferences.
            - Agenda dan Log Surat Dinas: Pencatatan dan pemantauan surat masuk, surat keluar, disposisi.
            - Pengajuan SKHPP: Layanan Surat Keterangan Hasil Penelitian Personel.
            - Manajemen Kas dan Logistik: Monitoring Kas Denintel dan Kas Taktis Satuan.
            - Mitra Intelijen: Monitoring jaringan kerja intelijen lapangan.
            - Tanda Tangan Elektronik Komandan: Persetujuan dokumen resmi kedinasan.
            - Pelanggaran Personel: Rekap catatan disiplin internal.
            - Direktori Personel: Informasi kontak dinas seluruh personel satuan.
            - Notifikasi Kedinasan: Saluran pengumuman dan instruksi resmi.
            
            ### Detail Teknis:
            - Kerangka Kerja: Kotlin Jetpack Compose (Material 3)
            - Min SDK: Android 8.0 (API 26)
            - Target SDK: Android 14 (API 34)
            - Berkas APK: SISINDEN-v1.0.0.apk, app-debug.apk, app-release.apk
          files: release-output/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
