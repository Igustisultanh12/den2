name: SISINDEN Android — Build, Test & Release

# Build & test di setiap push/PR. GitHub Release HANYA dibuat dari tag v* dan
# hanya bila APK rilis benar-benar ditandatangani dengan keystore resmi.
on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend mobile API tests (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, dom
          coverage: none
      - name: Install Composer dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --no-interaction
      - name: Run mobile API security & contract tests
        run: php artisan test --filter=MobileApiSecurityTest

  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      SISINDEN_KEYSTORE_BASE64: ${{ secrets.SISINDEN_KEYSTORE_BASE64 }}
      SISINDEN_KEYSTORE_PASSWORD: ${{ secrets.SISINDEN_KEYSTORE_PASSWORD }}
      SISINDEN_KEY_ALIAS: ${{ secrets.SISINDEN_KEY_ALIAS }}
      SISINDEN_KEY_PASSWORD: ${{ secrets.SISINDEN_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore (only if secrets are configured)
        if: env.SISINDEN_KEYSTORE_BASE64 != ''
        run: |
          echo "$SISINDEN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sisinden-release.jks"
          echo "SISINDEN_KEYSTORE_PATH=$RUNNER_TEMP/sisinden-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint (report only)
        working-directory: android
        continue-on-error: true
        run: gradle :app:lintDebug

      - name: Assemble debug & release
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs, verify signature, compute SHA-256
        id: collect
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName *= *"' android/app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/SISINDEN-${VERSION}-debug.apk"
          SIGNED=false
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/SISINDEN-${VERSION}.apk"
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs "out/SISINDEN-${VERSION}.apk"
            SIGNED=true
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/SISINDEN-${VERSION}-unsigned.apk"
            echo "::warning title=Unsigned release::Secrets keystore belum dikonfigurasi; APK rilis tidak ditandatangani dan tidak akan dipublikasikan."
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SISINDEN-Android-${{ steps.collect.outputs.version }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            android/app/build/reports/lint-results-debug.html

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.collect.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SISINDEN Android ${{ github.ref_name }}
          body_path: docs/ANDROID_RELEASE_NOTES.md
          files: |
            out/SISINDEN-${{ steps.collect.outputs.version }}.apk
            out/SHA256SUMS.txt
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to release unsigned build
        if: startsWith(github.ref, 'refs/tags/v') && steps.collect.outputs.signed != 'true'
        run: |
          echo "::error title=Release blocked::Tag rilis dibuat tetapi APK tidak ditandatangani. Tambahkan secrets SISINDEN_KEYSTORE_BASE64, SISINDEN_KEYSTORE_PASSWORD, SISINDEN_KEY_ALIAS, SISINDEN_KEY_PASSWORD."
          exit 1
