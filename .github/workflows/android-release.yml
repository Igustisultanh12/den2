name: Build and Release SISINDEN Android Native APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Jar Exists
        run: |
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o "android/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Run Gradle Assemble Release
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --info 2>&1 | tee ../gradle_build.log || {
            BUILD_ERR=$?
            grep -E "e: |FAILURE:|Caused by:|Error:|error:" ../gradle_build.log | head -n 10 | while IFS= read -r line; do
              echo "::error title=GradleDiag::$line"
            done
            tail -n 8 ../gradle_build.log | while IFS= read -r line; do
              echo "::error title=GradleTail::$line"
            done
            exit $BUILD_ERR
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: gradle_build.log

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          shopt -s globstar nullglob
          apk_found=false
          for apk in android/app/build/**/*.apk; do
            if [ -f "$apk" ]; then
              echo "Processing APK: $apk"
              cp "$apk" release-output/SISINDEN-Release.apk
              cp "$apk" release-output/SISINDEN-v1.0.0.apk
              apk_found=true
              break
            fi
          done
          if [ "$apk_found" = false ]; then
            echo "::error title=APK Not Found::No APK file generated under android/app/build/"
            find android/app -maxdepth 5 || true
            exit 1
          fi
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SISINDEN-Android-Release-APK
          path: release-output/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('SISINDEN Android Native {0}', github.ref_name) || format('SISINDEN Android Native v1.0.{0}', github.run_number) }}
          body: |
            ## Rilis Aplikasi SISINDEN Android Native
            
            Aplikasi resmi kedinasan SISINDEN (Sistem Informasi dan Surat Intelijen Denintel Kodaeral V).
            
            ### Fitur Utama:
            - Otentikasi dan Keamanan: Integrasi login resmi, penyimpanan token terenkripsi DataStore Preferences.
            - Agenda dan Log Surat Dinas: Pencatatan dan pemantauan surat masuk, surat keluar, disposisi.
            - Pengajuan SKHPP: Layanan Surat Keterangan Hasil Penelitian Personel.
            - Manajemen Kas dan Logistik: Monitoring Kas Denintel dan Kas Taktis Satuan.
            - Mitra Intelijen: Monitoring jaringan kerja intelijen lapangan.
            - Tanda Tangan Elektronik Komandan: Persetujuan dokumen resmi kedinasan.
            - Pelanggaran Personel: Rekap catatan disiplin internal.
            - Direktori Personel: Informasi kontak dinas seluruh personel satuan.
            - Notifikasi Kedinasan: Saluran pengumuman dan instruksi resmi.
            
            ### Detail Teknis:
            - Kerangka Kerja: Kotlin Jetpack Compose (Material 3)
            - Min SDK: Android 8.0 (API 26)
            - Target SDK: Android 14 (API 34)
            - Berkas APK: SISINDEN-Release.apk dan SISINDEN-v1.0.0.apk
          files: release-output/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
